name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；已经排队的保留，正在跑的等它做完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.1

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 门禁：缺来源、缺日期、slug 重复等一律在这里失败，不允许上线
      - name: 内容体检
        run: node scripts/validate-content.mjs

      - name: 构建站点
        run: node scripts/build.mjs

      # 产物自检：哪些页面该存在、哪些字样不该出现、锚点数与索引是否一致、
      # 隐藏分类是否真的被 noindex。构建成功不等于产物正确。
      - name: 产物自检
        run: node scripts/check-built.mjs

      # 搜索是三个模块之外唯一的入口。索引退化必须拦住，
      # 不能靠人「看一眼觉得还行」——这个脚本有断言，零命中就退出 1。
      - name: 搜索实测
        run: node scripts/check-search.mjs

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
